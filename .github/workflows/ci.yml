name: CI
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and build
        run: npm ci && npm run build
      - name: Test
        run: npm test -- --run
      - name: Lint
        run: npm run lint
      - name: Set up Python tests
        run: |
          python -m venv jobs/.venv
          jobs/.venv/bin/python -m pip install pytest==8.4.2
      - name: Jobs tests
        working-directory: jobs
        run: .venv/bin/python -m pytest
      - name: Strict Python types
        working-directory: jobs
        run: ../node_modules/.bin/pyright